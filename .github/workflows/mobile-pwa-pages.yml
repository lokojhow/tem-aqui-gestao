name: Publicar Tem Aqui Gestão Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos web
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'desktop' --exclude 'node_modules' --exclude 'package-lock.json' --exclude 'package.json' ./ _site/
          touch _site/.nojekyll
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
