name: Build Tem Aqui Gestão Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'forge.config.js'
      - '.github/workflows/windows-desktop-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador Windows
        run: npm run make:windows

      - name: Enviar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Tem-Aqui-Gestao-Windows
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
          if-no-files-found: error
          retention-days: 30
