name: Build Tem Aqui Gestão Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'package.json'
      - 'forge.config.js'
      - '.github/workflows/windows-desktop-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Definir versão deste build
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador Windows
        run: npm run make:windows

      - name: Preparar instalador estável
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path out/make -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Instalador .exe não encontrado" }
          Copy-Item $setup.FullName "Tem-Aqui-Gestao-Setup.exe" -Force

      - name: Enviar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Tem-Aqui-Gestao-Windows
          path: |
            Tem-Aqui-Gestao-Setup.exe
            out/make/**/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Publicar atualização para o programa
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "version=$env:BUILD_VERSION`n`nAtualização automática do Tem Aqui Gestão para Windows."
          gh release view windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest "Tem-Aqui-Gestao-Setup.exe" --repo $env:GITHUB_REPOSITORY --title "Tem Aqui Gestão Windows $env:BUILD_VERSION" --notes $notes --target $env:GITHUB_SHA
          } else {
            gh release edit windows-latest --repo $env:GITHUB_REPOSITORY --title "Tem Aqui Gestão Windows $env:BUILD_VERSION" --notes $notes
            gh release upload windows-latest "Tem-Aqui-Gestao-Setup.exe" --repo $env:GITHUB_REPOSITORY --clobber
          }
